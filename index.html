<!doctype html>
<html lang="en" data-theme="light" data-accent="red">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme')
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Replaced as soon as the app starts. If this text stays, the JavaScript didn't load: the site was served without running "npm run build". -->
      <p style="font-family: system-ui, sans-serif; text-align: center; margin-top: 80px; color: #5c6b78">Loading Life…</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
